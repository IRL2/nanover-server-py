[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "nanover-server"
authors = [
    {name = "Intangible Realities Lab"},
]
description = "Python servers for NanoVer."
license = "MIT"
keywords = ["molecular dynamics", "interactive molecular dynamics", "imd", "imd-vr", "imd-xr", "virtual reality", "vr", "extended reality", "xr"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3 :: Only",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX",

    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

requires-python = ">=3.12"
dependencies = [
    "openmm",
    "MDAnalysis",
    "numpy",
    "psutil >= 7.2.0",
    "nglview>=4.0.1",
    "ase >= 3.21",
    "websockets>=15.0.0",
    "msgpack>=1.0.0",
    # mdanalysis will include this soon anyway
    "pooch",
]

[project.urls]
homepage = "https://github.com/IRL2/nanover-server-py"
source = "https://github.com/IRL2/nanover-server-py"
documentation = "https://irl2.github.io/nanover-docs/"
issues = "https://github.com/IRL2/nanover-server-py/issues"
funding = "https://irl2.github.io/nanover-docs/#current-sponsors"
changelog = "https://github.com/IRL2/nanover-server-py/commits/main/"

[project.optional-dependencies]
dev=[
    # Requirement files for running the tests.
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "hypothesis",
    # python-osc is needed to test an example
    "python-osc",
    # mock is required for some core tests
    "mock",
    # type checking
    "mypy",
    "typing_extensions",
    # jupyter notebooks
    "nbval",
    # ui
    #"gradio>=5.18.0",
    # types
    "types-netifaces",
]

[project.scripts]
nanover-server = "nanover.app.cli.server_cli:main"
nanover-record = "nanover.app.cli.recorder_cli:main"
nanover-essd-list = "nanover.essd.list_cli:main"
nanover-dump-state = "nanover.recording.cli.dump_cli:main"
nanover-split-recording = "nanover.recording.cli.split_cli:main"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["nanover.*"]  # package names should match these glob patterns (["*"] by default)

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}
